# Headers for the static app shell. API and admin responses carry Django's own headers, so this
# snippet is included only in the static locations (proxied responses must not get duplicates).
# nginx drops inherited add_header lines when a block defines its own, hence the include per location.
#
# HSTS is not set here: it is only meaningful over HTTPS and belongs to the TLS terminator (slice 0.5).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
