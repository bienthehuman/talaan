version: 2

updates:
  - package-ecosystem: pip
    directory: /server
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    groups:
      client: { patterns: ["*"] }
    ignore:
      # typescript-eslint 8.x needs < 6.1 and openapi-typescript 7.x needs 5.x (see CLAUDE.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups:
      e2e: { patterns: ["*"] }
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/server, /client]
    schedule: { interval: weekly }
    ignore:
      # The base images follow .python-version and .nvmrc, which CI uses too. Moving to another
      # Python minor or Node major is a deliberate change made in one PR for all of them.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
