name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job names (server, client, e2e, prod-smoke) are the required status checks for `main` and are
# also checked by the release workflow. Do not rename them without updating the branch ruleset.
jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: server/.python-version
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Environment file
        working-directory: .
        run: |
          cp .env.example .env
          sed -i 's/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-only-secret-key-for-tests-not-for-production/' .env
      # The same compose database as local development: the init script creates the owner and
      # least-privilege app roles, so tests run as the restricted role in CI too.
      - name: Start Postgres
        working-directory: .
        run: docker compose up -d --wait db
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrate as the owner role
        run: bash scripts/migrate.sh
      - run: python -m pytest
      - name: OpenAPI schema is up to date
        run: |
          python manage.py spectacular --file /tmp/openapi.yml --validate
          diff -u openapi.yml /tmp/openapi.yml || {
            echo "::error::server/openapi.yml is stale. Run: cd server && python manage.py spectacular --file openapi.yml --validate"
            exit 1
          }

  client:
    name: client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-types.ts || {
            echo "::error::client/src/lib/api-types.ts is stale. Run: cd client && npm run gen:api"
            exit 1
          }
      # Build-time tooling is excluded: findings there never ship to the browser (see CLAUDE.md).
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Fresh stack, demo logins, Playwright
        run: bash scripts/e2e.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Deploys the production compose stack exactly as a real host would, with throwaway secrets and
  # Caddy's internal CA for `localhost`: deploy.sh, smoke checks, backup and restore, and a redeploy.
  prod-smoke:
    name: prod-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENV_FILE: ${{ github.workspace }}/.env.prod
      SMOKE_INSECURE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Production env file with throwaway secrets
        run: |
          {
            echo "TALAAN_DOMAIN=localhost"
            echo "TALAAN_VERSION=ci"
            echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_SUPERUSER_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "HTTP_PORT=8081"
            echo "HTTPS_PORT=8443"
          } > .env.prod
      - name: Deploy (build, migrate, start, smoke checks)
        run: DEPLOY_BUILD=1 bash scripts/deploy.sh
      - name: Create a user and sign in through the deployed stack
        run: |
          . scripts/lib.sh
          load_env
          compose exec -T -e DJANGO_SUPERUSER_PASSWORD=ci-smoke-pass-123 server \
            python manage.py createsuperuser --noinput --username ci --email ci@example.invalid
          SMOKE_USER=ci SMOKE_PASSWORD=ci-smoke-pass-123 bash scripts/smoke.sh "$(base_url)"
      - name: Backup and restore round trip keeps the data and the app role's access
        run: |
          . scripts/lib.sh
          load_env
          bash scripts/backup.sh
          RESTORE_YES=1 bash scripts/restore.sh latest
          SMOKE_USER=ci SMOKE_PASSWORD=ci-smoke-pass-123 bash scripts/smoke.sh "$(base_url)"
      - name: Redeploy over the running stack
        run: DEPLOY_BUILD=1 bash scripts/deploy.sh
      - name: Container logs
        if: failure()
        run: |
          . scripts/lib.sh
          load_env
          compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: |
          . scripts/lib.sh
          load_env
          compose down -v --remove-orphans
