[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"conftest.py" = ["S105", "S106", "S107"]
"scripts/mutation_check_service.py" = ["E501", "S603"]
"**/migrations/**" = ["E501"]
"config/settings*.py" = ["S105"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = ["phase1: the phase 1 exit scenarios (docs/failure-scenarios.md); run with -m phase1"]
filterwarnings = ["ignore:No directory at.*staticfiles:UserWarning"]
