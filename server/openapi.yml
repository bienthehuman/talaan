openapi: 3.0.3
info:
  title: Talaan API
  version: 0.1.0
  description: 'Offline-first field data sync. Protocol: docs/protocol.md'
paths:
  /api/admin/assignments/:
    get:
      operationId: admin_assignments_list
      summary: List assignments
      parameters:
      - in: query
        name: cancelled
        schema:
          type: string
          enum:
          - any
          - 'false'
          - 'true'
        description: Default any.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: worker
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminAssignmentList'
          description: ''
    post:
      operationId: admin_assignments_create
      summary: Assign a published form version to a worker
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignmentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignmentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAssignment'
          description: ''
  /api/admin/assignments/{id}/cancel/:
    post:
      operationId: admin_assignments_cancel_create
      summary: Cancel an assignment (existing submissions stay)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAssignment'
          description: ''
  /api/admin/conflicts/:
    get:
      operationId: admin_conflicts_list
      description: 'Every refused change from a worker''s device: conflicts and rejections,
        newest first.'
      summary: The conflict log
      parameters:
      - in: query
        name: changed_since
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Whether the same worker changed the record on the server afterwards.
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - conflict
          - rejected
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: worker
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConflictLogRowList'
          description: ''
  /api/admin/form-versions/{id}/:
    get:
      operationId: admin_form_versions_retrieve
      summary: One form version with its schema
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormVersionDetail'
          description: ''
  /api/admin/forms/:
    get:
      operationId: admin_forms_list
      summary: Forms with their versions
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFormList'
          description: ''
    post:
      operationId: admin_forms_create
      summary: Create a form (it has no versions yet)
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FormCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
          description: ''
  /api/admin/forms/{id}/versions/:
    post:
      operationId: admin_forms_versions_create
      description: |-
        Publish a new version of a form. The schema is checked with the same rules as the Django
        admin, and a published version can never change (ADR 0008).
      summary: Publish a new version of a form
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SchemaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SchemaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormVersionDetail'
          description: ''
  /api/admin/forms/check-schema/:
    post:
      operationId: admin_forms_check_schema_create
      description: 'For the editor''s live feedback: the problems a publish would
        report, without publishing.'
      summary: Check a form schema without publishing it
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SchemaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SchemaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaCheck'
          description: ''
  /api/admin/submissions/:
    get:
      operationId: admin_submissions_list
      description: 'The review queue: every submission, newest change first.'
      summary: List submissions (the review queue)
      parameters:
      - in: query
        name: assignment
        schema:
          type: integer
      - in: query
        name: deleted
        schema:
          type: string
          enum:
          - any
          - 'false'
          - 'true'
        description: Default false.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: draft, submitted, approved or returned.
      - in: query
        name: worker
        schema:
          type: integer
        description: The worker's user id.
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionRowList'
          description: ''
  /api/admin/submissions/{record_id}/:
    get:
      operationId: admin_submissions_retrieve
      summary: One submission with its data, form schema and event history
      parameters:
      - in: path
        name: record_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
          description: ''
  /api/admin/submissions/{record_id}/actions/:
    post:
      operationId: admin_submissions_actions_create
      description: |-
        An admin acts on one submission: approve, return, restore, delete or edit.

        Same core as push (docs/protocol.md section 5): advisory lock, version bump, ledger row, event.
        The answer is the service's result, so a refusal is a 200 with `rejected`.
      summary: Act on a submission as an admin
      parameters:
      - in: path
        name: record_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminActionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminActionRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/admin/workers/:
    get:
      operationId: admin_workers_list
      summary: Workers an assignment can be given to
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRef'
          description: ''
  /api/assignments/:
    get:
      operationId: assignments_retrieve
      description: Endpoints that take the client's protocol version in the X-Client-Schema
        header.
      summary: Assignments (the whole list, not paged)
      parameters:
      - in: header
        name: X-Client-Schema
        schema:
          type: integer
        description: The client's protocol version. Below the server's minimum the
          answer is 426.
        required: true
      tags:
      - assignments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Exchange credentials for an access and refresh token. Rate limited
        per client.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/form-versions/:
    get:
      operationId: form_versions_retrieve
      description: Endpoints that take the client's protocol version in the X-Client-Schema
        header.
      summary: Published form versions the user needs (the whole list, not paged)
      parameters:
      - in: header
        name: X-Client-Schema
        schema:
          type: integer
        description: The client's protocol version. Below the server's minimum the
          answer is 426.
        required: true
      tags:
      - form-versions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormVersionList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Liveness and database check. No auth, no side effects.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          description: Database unreachable (problem+json)
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/sync/pull/:
    get:
      operationId: sync_pull_retrieve
      description: Endpoints that take the client's protocol version in the X-Client-Schema
        header.
      summary: Pull changes since a cursor
      parameters:
      - in: header
        name: X-Client-Schema
        schema:
          type: integer
        description: The client's protocol version. Below the server's minimum the
          answer is 426.
        required: true
      - in: query
        name: cursor
        schema:
          type: integer
        description: Last server_seq already received (0 to start).
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, default 200, at most 500.
      tags:
      - sync
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/sync/push/:
    post:
      operationId: sync_push_create
      description: Applies up to 50 mutations in order, each in its own transaction,
        and returns one result per mutation. A repeated mutation_id returns its stored
        result.
      summary: Push local changes
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PushRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PushRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '426':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
components:
  schemas:
    AdminActionRequestRequest:
      type: object
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 32
        reason:
          type: string
          default: ''
          maxLength: 500
        fields:
          type: object
          additionalProperties: {}
      required:
      - action
    AdminAssignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        form_version_id:
          type: integer
          readOnly: true
        form_name:
          type: string
        form_version_number:
          type: integer
        worker:
          $ref: '#/components/schemas/UserRef'
        site_name:
          type: string
          maxLength: 200
        due_date:
          type: string
          format: date
          nullable: true
        cancelled:
          type: boolean
        submissions:
          type: integer
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cancelled
      - created_at
      - form_name
      - form_version_id
      - form_version_number
      - id
      - site_name
      - worker
    AdminFormVersion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - number
      - published_at
    Assignment:
      type: object
      properties:
        id:
          type: integer
        form_version_id:
          type: integer
        form_name:
          type: string
        site_name:
          type: string
        due_date:
          type: string
          format: date
          nullable: true
        cancelled:
          type: boolean
      required:
      - cancelled
      - due_date
      - form_name
      - form_version_id
      - id
      - site_name
    AssignmentCreateRequest:
      type: object
      properties:
        form_version_id:
          type: integer
        worker_id:
          type: integer
        site_name:
          type: string
          minLength: 1
          maxLength: 200
        due_date:
          type: string
          format: date
          nullable: true
      required:
      - form_version_id
      - site_name
      - worker_id
    AssignmentList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
      required:
      - results
    CodeEnum:
      enum:
      - locked
      - not_found
      - id_taken
      - invalid
      - invalid_state
      - unknown_form_version
      - mutation_id_reuse
      - forbidden
      type: string
      description: |-
        * `locked` - locked
        * `not_found` - not_found
        * `id_taken` - id_taken
        * `invalid` - invalid
        * `invalid_state` - invalid_state
        * `unknown_form_version` - unknown_form_version
        * `mutation_id_reuse` - mutation_id_reuse
        * `forbidden` - forbidden
    Conflict:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ConflictKindEnum'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ConflictField'
      required:
      - fields
      - kind
    ConflictField:
      type: object
      properties:
        field:
          type: string
        server_value:
          nullable: true
        client_value:
          nullable: true
        server_version:
          type: integer
      required:
      - field
    ConflictKindEnum:
      enum:
      - field_conflict
      - deleted_remotely
      - edited_since_base
      type: string
      description: |-
        * `field_conflict` - field_conflict
        * `deleted_remotely` - deleted_remotely
        * `edited_since_base` - edited_since_base
    ConflictLogRow:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        kind:
          $ref: '#/components/schemas/ConflictLogRowKindEnum'
        reason:
          type: string
          description: The conflict kind or the rejection code.
        fields:
          type: array
          items:
            type: string
        submission_id:
          type: string
          format: uuid
        site_name:
          type: string
        form_name:
          type: string
        worker:
          $ref: '#/components/schemas/UserRef'
        mutation_id:
          type: string
          format: uuid
          nullable: true
        changed_since:
          type: boolean
          description: The same worker has changed this record on the server since.
      required:
      - changed_since
      - created_at
      - fields
      - form_name
      - id
      - kind
      - mutation_id
      - reason
      - site_name
      - submission_id
      - worker
    ConflictLogRowKindEnum:
      enum:
      - conflict
      - rejected
      type: string
      description: |-
        * `conflict` - conflict
        * `rejected` - rejected
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        actor:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          nullable: true
        mutation_id:
          type: string
          format: uuid
          nullable: true
        detail: {}
        created_at:
          type: string
          format: date-time
      required:
      - actor
      - id
      - kind
      - version
    EventKindEnum:
      enum:
      - created
      - updated
      - submitted
      - deleted
      - restored
      - approved
      - returned
      - admin_edited
      - conflict
      - rejected
      type: string
      description: |-
        * `created` - Created
        * `updated` - Updated
        * `submitted` - Submitted
        * `deleted` - Deleted
        * `restored` - Restored
        * `approved` - Approved
        * `returned` - Returned
        * `admin_edited` - Admin Edited
        * `conflict` - Conflict
        * `rejected` - Rejected
    FieldError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - code
      - field
      - message
    Form:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/AdminFormVersion'
      required:
      - created_at
      - id
      - name
      - versions
    FormCreateRequest:
