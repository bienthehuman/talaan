# Local development and e2e stack: `docker compose up --build` serves the app at http://localhost:8080.
# `docker compose up -d db` alone starts just the database for running the server on the host.
# A production compose file arrives with slice 0.5.

x-server-env: &server-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-compose-key}
  DJANGO_DEBUG: "1"
  # The dev container adds the Codespaces hostnames here (.devcontainer/devcontainer.json).
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,server}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  POSTGRES_DB: ${POSTGRES_DB:-talaan}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  # Throttling is covered by pytest. The e2e suite signs in many times a minute.
  THROTTLE_LOGIN: 1000/min
  # Raised only by loadtest/run.sh: one load-test device is one user, and 120 pushes a minute per user
  # would measure the rate limiter instead of the server.
  THROTTLE_PUSH: ${THROTTLE_PUSH:-120/min}
  LOG_FORMAT: ${LOG_FORMAT:-plain}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
  # Dev and e2e only (the server refuses it without DEBUG). scripts/e2e.sh turns it on; the production
  # compose file never sets it.
  FAULT_INJECTION: ${FAULT_INJECTION:-0}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      # Container superuser: only used by the init script to create the two app roles.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev}
      OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-talaan_owner_dev}
      APP_PASSWORD: ${POSTGRES_PASSWORD:-talaan_app_dev}
      CREATE_TEST_DB: "1"
    ports:
      # 5434 on the host so it does not clash with a local Postgres on 5432 or another local Postgres on 5433.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talaan"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations as the OWNER role, then exits. The server never runs DDL.
  migrate:
    build: ./server
    image: talaan-server:dev
    command: python manage.py migrate --noinput
    environment:
      <<: *server-env
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-talaan_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-talaan_owner_dev}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build: ./server
    image: talaan-server:dev
    restart: unless-stopped
    environment:
      <<: *server-env
      POSTGRES_USER: ${POSTGRES_USER:-talaan_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talaan_app_dev}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./client
      args:
        VITE_STYLEGUIDE: ${VITE_STYLEGUIDE:-1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
