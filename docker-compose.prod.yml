# Production stack for a single Docker host. See DEPLOY.md.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --wait
#
# or, normally, `bash scripts/deploy.sh [version]`.
#
# Only Caddy publishes ports (80 and 443). The database, Django and nginx stay on the private
# network. Every secret is required: a missing one stops the stack rather than using a default.
name: talaan-prod

x-server-env: &server-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.prod}
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: ${TALAAN_DOMAIN:?set TALAAN_DOMAIN in .env.prod}
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${TALAAN_DOMAIN}
  POSTGRES_DB: talaan
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  THROTTLE_LOGIN: ${THROTTLE_LOGIN:-10/min}
  JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-5}
  JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # JSON lines on stdout. /metrics exists only when a token is set, and only inside the stack
  # (the public proxy answers 404): scrape http://server:8000/metrics with that token.
  LOG_FORMAT: json
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  # Two proxies in front of Django (Caddy, nginx): the client address is the one before them.
  NUM_PROXIES: "2"

x-server-image: &server-image
  build: ./server
  image: ${TALAAN_IMAGE_PREFIX:-ghcr.io/bienthehuman/talaan}-server:${TALAAN_VERSION:-latest}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      # The container superuser is only used by the init script and by backups.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env.prod}
      OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env.prod}
      APP_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talaan"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations as the OWNER role, then exits. The running server never does DDL.
  migrate:
    <<: *server-image
    command: python manage.py migrate --noinput
    environment:
      <<: *server-env
      POSTGRES_USER: talaan_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env.prod}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    <<: *server-image
    restart: unless-stopped
    environment:
      <<: *server-env
      POSTGRES_USER: talaan_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Django redirects plain HTTP to HTTPS, so say the request already came in over HTTPS.
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/health/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'], 'X-Forwarded-Proto': 'https'}), timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./client
      args:
        VITE_STYLEGUIDE: "0"
    image: ${TALAAN_IMAGE_PREFIX:-ghcr.io/bienthehuman/talaan}-web:${TALAAN_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      TALAAN_DOMAIN: ${TALAAN_DOMAIN:?set TALAAN_DOMAIN in .env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
